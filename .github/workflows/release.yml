name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check extension/notas.js
      - run: node tests/notas.test.cjs
      - name: Build and verify version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/"$RELEASE_TAG"/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/"$RELEASE_TAG"/* --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
